- "chapter": "I"
  "ru": "Так говорила в июле 1805 года известная Анна Павловна Шерер, фрейлина и приближенная императрицы Марии Феодоровны, встречая важного и чиновного князя Василия, первого приехавшего на ее вечер."
- "chapter": "II"
  "ru": "Приехала высшая знать Петербурга, люди самые разнородные по возрастам и характерам, но одинаковые по обществу, в каком все жили; приехала дочь князя Василия, красавица Элен, заехавшая за отцом, чтобы с ним вместе ехать на праздник посланника."
- "chapter": "III"
  "ru": "Кроме тетушки, около которой сидела только одна пожилая дама с исплаканным, худым лицом, несколько чужая в этом блестящем обществе, общество разбилось на три кружка."
- "chapter": "IV"
  "ru": "Несмотря на то, что князь Василий неохотно и почти неучтиво слушал пожилую даму и даже выказывал нетерпение, она ласково и трогательно улыбалась ему и, чтоб он не ушел, взяла его за руку."
- "chapter": "V"
  "ru": "Толстый, выше обыкновенного роста, широкий, с огромными красными руками, он, как говорится, не умел войти в салон и еще менее умел из него выйти, то есть перед выходом сказать что-нибудь особенно приятное."
- "chapter": "VI"
  "ru": "В середине ужина князь Андрей облокотился и, как человек, давно имеющий что-нибудь на сердце и вдруг решающийся высказаться, с выражением нервного раздражения, в каком Пьер никогда еще не видал своего приятеля, начал говорить."
- "chapter": "VII"
  "ru": "О нем было доложено государю, и, не в пример другим, он был переведен в гвардию Семеновского полка прапорщиком."
- "chapter": "VIII"
  "ru": "Графиня глядела на гостью, приятно улыбаясь, впрочем, не скрывая того, что не огорчится теперь нисколько, если гостья поднимется и уедет."
- "chapter": "IX"
  "ru": "Соня была тоненькая, миниатюрненькая брюнетка с мягким, оттененным длинными ресницами взглядом, густою черною косою, два раза обвивавшею ее голову, и желтоватым оттенком кожи на лице и в особенности на обнаженных худощавых, но грациозных мускулистых руках и шее."
- "chapter": "X"
  "ru": "Наташа, притихнув, выглядывала из своей засады, ожидая, что он будет делать."
- "chapter": "XI"
  "ru": "Графине хотелось с глазу на глаз поговорить с другом своего детства, княгиней Анной Михайловной, которую она не видала хорошенько с ее приезда из Петербурга."
- "chapter": "XII"
  "ru": "Несмотря на то, что чья-то карета стояла у подъезда, швейцар, оглядев мать с сыном, которые, не приказывая докладывать о себе, прямо вошли в стеклянные сени между двумя рядами статуй в нишах, значительно посмотрев на старенький салоп, спросил, кого им угодно, княжен или графа."
- "chapter": "XIII"
  "ru": "В то время как Борис вошел к нему, Пьер ходил по своей комнате, изредка останавливаясь в углах, делая угрожающие жесты к стене, как будто пронзая невидимого врага шпагой, и строго взглядывая сверх очков и затем вновь начиная свою прогулку."
- "chapter": "XIV"
  "ru": "Когда Анна Михайловна уехала с сыном к графу Кириллу Владимировичу Безухову, графиня Ростова долго сидела одна, прикладывая платок к глазам."
- "chapter": "XV"
  "ru": "Граф провел гостей мужчин в кабинет, предлагая им свою охотницкую коллекцию турецких трубок."
- "chapter": "XVI"
  "ru": "Полковник рассказал, что манифест об объявлении войны уже вышел в Петербурге и что экземпляр, который он сам видел, доставлен ныне курьером главнокомандующему."
- "chapter": "XVII"
  "ru": "Граф, распустив карты веером, с трудом удерживался от привычки послеобеденного сна и всему смеялся."
- "chapter": "XVIII"
  "ru": "В то время как у Ростовых танцовали в зале шестой англез под звуки от усталости фальшививших музыкантов, и усталые официанты и повара готовили ужин, с графом Безуховым сделался шестой удар."
- "chapter": "XIX"
  "ru": "В то время как такие разговоры происходили в приемной и в княжниной комнатах, карета с Пьером, за которым было послано, и с Анной Михайловной, которая нашла нужным ехать с ним, въезжала во двор графа Безухова."
- "chapter": "XX"
  "ru": "Часть комнаты за колоннами, где с одной стороны стояла высокая красного дерева кровать, под шелковыми занавесами, а с другой огромный киот с образами, была красно и ярко освещена, как бывают освещены церкви во время вечерней службы."
- "chapter": "XXI"
  "ru": "В приемной никого уже не было, кроме князя Василия и старшей княжны, которые, сидя под портретом Екатерины, о чем-то оживленно говорили."
- "chapter": "XXII"
  "ru": "В Лысых Горах, имении князя Николая Андреевича Болконского, ожидали с каждым днем приезда молодого князя Андрея с княгиней; но ожидание не нарушило стройного порядка, по которому шла жизнь в доме старого князя."
- "chapter": "XXIII"
  "ru": "В это время подъехала к крыльцу карета и бричка, и из кареты вышел князь Андрей, высадил свою маленькую жену и пропустил ее вперед."
- "chapter": "XXIV"
  "ru": "В назначенный час, напудренный и выбритый, князь вышел в столовую, где ожидала его невестка, княжна Марья, мадемуазель Бурьен и архитектор князя, по странной прихоти его допускаемый к столу."
- "chapter": "XXV"
  "ru": "В минуты отъезда и перемены жизни, на людей, способных обдумывать свои поступки, обыкновенно находит серьезное настроение мыслей."
