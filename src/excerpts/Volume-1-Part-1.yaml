- id: I
  ru: "Так говорила в июле 1805 года известная Анна Павловна Шерер, фрейлина и приближенная императрицы Марии Феодоровны, встречая важного и чиновного князя Василия, первого приехавшего на ее вечер."
  en: "Thus spoke in July 1805 the well-known Anna Pavlovna Scherer, maid of honor and confidante of Empress Maria Feodorovna, as she greeted the important and high-ranking Prince Vasily, the first to arrive at her evening gathering."
  roman: "Tak govorila v iyule 1805 goda izvestnaya Anna Pavlovna Sherer, freylina i priblizhennaya imperatritsy Marii Feodorovny, vstrechaya vazhnogo i chinovnogo knyazya Vasiliya, pervogo priekhavshego na yeye vecher."
  words: "Так (thus / so) говорила (spoke / said) в (in) июле (July) 1805 (1805) года (year) известная (well-known) Анна (Anna) Павловна (Pavlovna) Шерер (Scherer), фрейлина (maid of honor) и (and) приближенная (confidante / close associate) императрицы (of the empress) Марии (Maria) Феодоровны (Feodorovna), встречая (greeting / meeting) важного (important) и (and) чиновного (high-ranking / official) князя (Prince) Василия (Vasily), первого (the first) приехавшего (to have arrived) на (at / to) ее (her) вечер (evening gathering)."

- id: II
  ru: "Приехала высшая знать Петербурга, люди самые разнородные по возрастам и характерам, но одинаковые по обществу, в каком все жили; приехала дочь князя Василия, красавица Элен, заехавшая за отцом, чтобы с ним вместе ехать на праздник посланника."
  en: "The highest society of Petersburg began to arrive: people most varied in age and character, yet alike in the society in which they all lived; Prince Vasily’s daughter, the beautiful Hélène, also arrived to collect her father so that they could go together to the ambassador’s reception."
  roman: "Priekhala vysshaya znat Peterburga, lyudi samye raznorodnye po vozrastam i kharakteram, no odinakovye po obshchestvu, v kakom vse zhili; priekhala doch knyazya Vasiliya, krasavitsa Elen, zaekhavshaya za ottsom, chtoby s nim vmeste yekhat na prazdnik poslannika."
  words: "Приехала (arrived) высшая (the highest) знать (nobility / society) Петербурга (of Petersburg), люди (people) самые (the most) разнородные (varied / diverse) по (in / with respect to) возрастам (ages) и (and) характерам (characters / temperaments), но (but) одинаковые (alike / the same) по (in) обществу (society), в (in) каком (which) все (all) жили (lived); приехала (arrived) дочь (daughter) князя (of Prince) Василия (Vasily), красавица (the beauty / beautiful woman) Элен (Hélène), заехавшая (who had stopped by / called in) за (for) отцом (her father), чтобы (in order to / so as to) с (with) ним (him) вместе (together) ехать (to go) на (to) праздник (celebration / fête) посланника (of the ambassador)."

- id: III
  ru: "Кроме тетушки, около которой сидела только одна пожилая дама с исплаканным, худым лицом, несколько чужая в этом блестящем обществе, общество разбилось на три кружка."
  en: "Apart from the aunt, beside whom sat only one elderly lady with a thin, tear-stained face, somewhat out of place in that brilliant society, the company divided into three groups."
  roman: "Krome tetushki, okolo kotoroy sidela tolko odna pozhilaya dama s isplakannym, khudym litsom, neskolko chuzhaya v etom blestyashchem obshchestve, obshchestvo razbilos na tri kruzhka."
  words: "Кроме (apart from / besides) тетушки (the aunt), около (beside / near) которой (whom) сидела (sat) только (only) одна (one) пожилая (elderly) дама (lady) с (with) исплаканным (tear-stained / cried-over), худым (thin) лицом (face), несколько (somewhat) чужая (out of place / foreign) в (in) этом (this) блестящем (brilliant / glittering) обществе (society), общество (the company / society) разбилось (split / divided) на (into) три (three) кружка (groups / circles)."

- id: IV
  ru: "Несмотря на то, что князь Василий неохотно и почти неучтиво слушал пожилую даму и даже выказывал нетерпение, она ласково и трогательно улыбалась ему и, чтоб он не ушел, взяла его за руку."
  en: "Although Prince Vasily listened to the elderly lady reluctantly and almost discourteously, even showing impatience, she smiled at him tenderly and touchingly and, so that he would not leave, took his hand."
  roman: "Nesmotrya na to, chto knyaz Vasiliy neokhotno i pochti neuchtivo slushal pozhiluyu damu i dazhe vykazyval neterpenie, ona laskovo i trogatelno ulybalas emu i, chtob on ne ushel, vzyala ego za ruku."
  words: "Несмотря (despite) на (on) то (that), что (that) князь (Prince) Василий (Vasily) неохотно (reluctantly) и (and) почти (almost) неучтиво (discourteously) слушал (listened to) пожилую (elderly) даму (lady) и (and) даже (even) выказывал (showed) нетерпение (impatience), она (she) ласково (kindly / tenderly) и (and) трогательно (touchingly) улыбалась (smiled) ему (at him / to him) и (and), чтоб (so that) он (he) не (not) ушел (would leave), взяла (took) его (his) за (by) руку (hand)."

- id: V
  ru: "Толстый, выше обыкновенного роста, широкий, с огромными красными руками, он, как говорится, не умел войти в салон и еще менее умел из него выйти, то есть перед выходом сказать что-нибудь особенно приятное."
  en: "Stout, taller than average, broad, with huge red hands, he did not know, as the saying goes, how to enter a drawing room, and knew even less how to leave one—that is, how to say something especially pleasant before departing."
  roman: "Tolstyy, vyshe obyknovennogo rosta, shirokiy, s ogromnymi krasnymi rukami, on, kak govoritsya, ne umel voiti v salon i eshche menee umel iz nego vyiti, to yest pered vykhodom skazat chto-nibud osobenno priyatnoe."
  words: "Толстый (stout / fat), выше (taller than) обыкновенного (ordinary / average) роста (height), широкий (broad), с (with) огромными (huge) красными (red) руками (hands), он (he), как (as) говорится (is said), не (not) умел (knew how) войти (to enter) в (into) салон (drawing room / salon) и (and) еще (still / even) менее (less) умел (knew how) из (out of) него (it) выйти (to leave), то (that) есть (is), перед (before) выходом (departure / leaving) сказать (to say) что-нибудь (something) особенно (especially) приятное (pleasant)."

- id: VI
  ru: "В середине ужина князь Андрей облокотился и, как человек, давно имеющий что-нибудь на сердце и вдруг решающийся высказаться, с выражением нервного раздражения, в каком Пьер никогда еще не видал своего приятеля, начал говорить."
  en: "In the middle of supper Prince Andrei leaned on his elbow and, like a man who has long had something on his mind and suddenly resolves to speak out, began to speak with an expression of nervous irritation in which Pierre had never before seen his friend."
  roman: "V seredine uzhina knyaz Andrey oblokotilsya i, kak chelovek, davno imeyushchiy chto-nibud na serdtse i vdrug reshayshchiysya vyskazatsya, s vyrazheniem nervnogo razdrazheniya, v kakom Pyer nikogda eshche ne vidal svoyego priyatelya, nachal govorit."
  words: "В (in) середине (the middle) ужина (supper / dinner) князь (Prince) Андрей (Andrei) облокотился (leaned on his elbow) и (and), как (like) человек (a man), давно (long) имеющий (having) что-нибудь (something) на (on) сердце (his mind / heart) и (and) вдруг (suddenly) решающийся (resolving / daring) высказаться (to speak out), с (with) выражением (an expression) нервного (nervous) раздражения (irritation), в (in) каком (which) Пьер (Pierre) никогда (never) еще (before) не (not) видал (had seen) своего (his) приятеля (friend), начал (began) говорить (to speak)."

- id: VII
  ru: "О нем было доложено государю, и, не в пример другим, он был переведен в гвардию Семеновского полка прапорщиком."
  en: "The Emperor was informed about him, and unlike others he was transferred to the Semyonovsky Guards Regiment as an ensign."
  roman: "O nem bylo dolozheno gosudaryu, i, ne v primer drugim, on byl pereveden v gvardiyu Semenovskogo polka praporshchikom."
  words: "О (about) нем (him) было (was) доложено (reported) государю (to the sovereign / Emperor), и (and), не (not) в (as) пример (an example) другим (to others / unlike others), он (he) был (was) переведен (transferred) в (into) гвардию (the Guards) Семеновского (Semyonovsky) полка (regiment) прапорщиком (as an ensign)."

- id: VIII
  ru: "Графиня глядела на гостью, приятно улыбаясь, впрочем, не скрывая того, что не огорчится теперь нисколько, если гостья поднимется и уедет."
  en: "The countess looked at her guest with a pleasant smile, though not concealing that she would not be at all upset if the visitor now rose and left."
  roman: "Grafinya glyadela na gostyu, priyatno ulybayas, vprochem, ne skryvaya togo, chto ne ogorchitsya teper niskolko, yesli gostya podnimetsya i uyedet."
  words: "Графиня (the countess) глядела (looked) на (at) гостью (the female guest), приятно (pleasantly) улыбаясь (smiling), впрочем (however / though), не (not) скрывая (concealing) того (the fact), что (that) не (not) огорчится (will be upset) теперь (now) нисколько (at all), если (if) гостья (the guest) поднимется (gets up / rises) и (and) уедет (leaves)."

- id: IX
  ru: "Соня была тоненькая, миниатюрненькая брюнетка с мягким, оттененным длинными ресницами взглядом, густою черною косою, два раза обвивавшею ее голову, и желтоватым оттенком кожи на лице и в особенности на обнаженных худощавых, но грациозных мускулистых руках и шее."
  en: "Sonya was a slim, petite brunette, with a soft gaze shaded by long eyelashes, a thick black braid wound twice around her head, and a yellowish hue to the skin of her face and especially of her bare, slender yet graceful and muscular arms and neck."
  roman: "Sonya byla tonenkaya, miniatyurnenkaya bryunetka s myagkim, ottenennym dlinnymi resnitsami vzglyadom, gustoyu chernoyu kosoyu, dva raza obvivavsheyu yeye golovu, i zheltovatym ottenkom kozhi na litse i v osobennosti na obnazhennykh khudoshchavykh, no gratsioznykh muskulistykh rukakh i sheye."
  words: "Соня (Sonya) была (was) тоненькая (slender / slight), миниатюрненькая (very petite), брюнетка (brunette) с (with) мягким (soft), оттененным (shaded) длинными (long) ресницами (eyelashes) взглядом (gaze), густою (thick) черною (black) косою (braid), два (two) раза (times) обвивавшею (wound around) ее (her) голову (head), и (and) желтоватым (yellowish) оттенком (tinge / hue) кожи (of skin) на (on) лице (the face) и (and) в (in) особенности (particular) на (on) обнаженных (bare) худощавых (slender), но (but) грациозных (graceful) мускулистых (muscular) руках (arms / hands) и (and) шее (neck)."

- id: X
  ru: "Наташа, притихнув, выглядывала из своей засады, ожидая, что он будет делать."
  en: "Natasha, now quiet, peered from her hiding place, waiting to see what he would do."
  roman: "Natasha, pritikhnyv, vyglyadyvala iz svoyey zasady, ozhidaya, chto on budet delat."
  words: "Наташа (Natasha), притихнув (having fallen quiet / quieting down), выглядывала (peered out) из (from) своей (her own) засады (hiding place / ambush), ожидая (waiting), что (what / that) он (he) будет (would) делать (do)."

- id: XI
  ru: "Графине хотелось с глазу на глаз поговорить с другом своего детства, княгиней Анной Михайловной, которую она не видала хорошенько с ее приезда из Петербурга."
  en: "The countess wanted to speak privately with her childhood friend, Princess Anna Mikhaylovna, whom she had not properly seen since her arrival from Petersburg."
  roman: "Grafinye khotelos s glazu na glaz pogovorit s drugom svoyego detstva, knyaginey Annoy Mikhaylovnoy, kotoruyu ona ne vidala khoroshenko s yeye priezda iz Peterburga."
  words: "Графине (the countess) хотелось (wanted / felt like) с (eye) глазу (to eye) на (to) глаз (eye) поговорить (to speak) с (with) другом (a friend) своего (her) детства (childhood), княгиней (Princess) Анной (Anna) Михайловной (Mikhaylovna), которую (whom) она (she) не (not) видала (had seen) хорошенько (properly / well) с (since) ее (her) приезда (arrival) из (from) Петербурга (Petersburg)."

- id: XII
  ru: "Несмотря на то, что чья-то карета стояла у подъезда, швейцар, оглядев мать с сыном, которые, не приказывая докладывать о себе, прямо вошли в стеклянные сени между двумя рядами статуй в нишах, значительно посмотрев на старенький салоп, спросил, кого им угодно, княжен или графа."
  en: "Although someone’s carriage stood at the entrance, the porter looked over the mother and son—who, without asking to be announced, had gone directly into the glass vestibule between two rows of statues in niches—and, after giving the old cloak a significant look, asked whether they wished to see the princesses or the count."
  roman: "Nesmotrya na to, chto chya-to kareta stoyala u podyezda, shveytsar, oglyadev mat s synom, kotorye, ne prikazyvaya dokladyvat o sebe, pryamo voshli v steklyannye seni mezhdu dvumya ryadami statuy v nishakh, znachitelno posmotrev na starenkiy salop, sprosil, kogo im ugodno, knyazhen ili grafa."
  words: "Несмотря (despite) на (on) то (that), что (that) чья-то (someone's) карета (carriage) стояла (stood) у (at) подъезда (the entrance), швейцар (porter), оглядев (having looked over) мать (mother) с (and) сыном (son), которые (who), не (not) приказывая (ordering) докладывать (to announce) о (about) себе (themselves), прямо (straight) вошли (entered) в (into) стеклянные (glass) сени (vestibule), между (between) двумя (two) рядами (rows) статуй (of statues) в (in) нишах (niches), значительно (meaningfully / significantly) посмотрев (having looked) на (at) старенький (old) салоп (cloak / cape), спросил (asked), кого (whom) им (they) угодно (wish to see), княжен (the princesses) или (or) графа (the count)."

- id: XIII
  ru: "В то время как Борис вошел к нему, Пьер ходил по своей комнате, изредка останавливаясь в углах, делая угрожающие жесты к стене, как будто пронзая невидимого врага шпагой, и строго взглядывая сверх очков и затем вновь начиная свою прогулку."
  en: "When Boris entered, Pierre was pacing his room, occasionally stopping in corners, making threatening gestures toward the wall as though piercing an invisible enemy with a sword, looking sternly over his spectacles, and then beginning his walk again."
  roman: "V to vremya kak Boris voshel k nemu, Pyer khodil po svoyey komnate, izredka ostanavlivayas v uglakh, delaya ugrozhayushchie zhesty k stene, kak budto pronzaya nevidimogo vraga shpagoy, i strogo vyglyadyvaya sverkh ochkov i zatem vnov nachinaya svoyu progulku."
  words: "В (at) то (the) время (time) как (when) Борис (Boris) вошел (entered) к (to) нему (him), Пьер (Pierre) ходил (walked / paced) по (around) своей (his) комнате (room), изредка (occasionally) останавливаясь (stopping) в (in) углах (corners), делая (making) угрожающие (threatening) жесты (gestures) к (toward) стене (the wall), как (as) будто (if) пронзая (piercing) невидимого (invisible) врага (enemy) шпагой (with a sword), и (and) строго (sternly) взглядывая (looking) сверх (over) очков (his spectacles) и (and) затем (then) вновь (again) начиная (beginning) свою (his) прогулку (walk)."

- id: XIV
  ru: "Когда Анна Михайловна уехала с сыном к графу Кириллу Владимировичу Безухову, графиня Ростова долго сидела одна, прикладывая платок к глазам."
  en: "When Anna Mikhaylovna left with her son for Count Kirill Vladimirovich Bezukhov’s, Countess Rostova sat alone for a long time, pressing a handkerchief to her eyes."
  roman: "Kogda Anna Mikhaylovna uyekhala s synom k grafu Kirillu Vladimirovichu Bezukhova, grafinya Rostova dolgo sidela odna, prikladyvaya platok k glazam."
  words: "Когда (when) Анна (Anna) Михайловна (Mikhaylovna) уехала (left) с (with) сыном (her son) к (to) графу (Count) Кириллу (Kirill) Владимировичу (Vladimirovich) Безухову (Bezukhov), графиня (Countess) Ростова (Rostova) долго (for a long time) сидела (sat) одна (alone), прикладывая (pressing) платок (a handkerchief) к (to) глазам (her eyes)."

- id: XV
  ru: "Граф провел гостей-мужчин в кабинет, предлагая им свою охотницкую коллекцию турецких трубок."
  en: "The count led the male guests to his study, offering them his hunting collection of Turkish pipes."
  roman: "Graf provel gostey-muzhchin v kabinet, predlagaya im svoyu okhotnitskuyu kollektsiyu turetskikh trubok."
  words: "Граф (the count) провел (led) гостей-мужчин (the male guests) в (into) кабинет (the study), предлагая (offering) им (them) свою (his) охотницкую (hunting) коллекцию (collection) турецких (Turkish) трубок (pipes)."

- id: XVI
  ru: "Полковник рассказал, что манифест об объявлении войны уже вышел в Петербурге и что экземпляр, который он сам видел, доставлен ныне курьером главнокомандующему."
  en: "The colonel said that the manifesto declaring war had already been issued in Petersburg and that a copy he himself had seen had that day been delivered by courier to the commander in chief."
  roman: "Polkovnik rasskazal, chto manifest ob obyavlenii voyny uzhe vyshel v Peterburge i chto ekzemplyar, kotoryy on sam videl, dostavlen nyne kuryerom glavnokomanduyushchemu."
  words: "Полковник (the colonel) рассказал (said / told), что (that) манифест (manifesto) об (about) объявлении (the declaration) войны (of war) уже (already) вышел (was issued / came out) в (in) Петербурге (Petersburg) и (and) что (that) экземпляр (a copy), который (which) он (he) сам (himself) видел (saw), доставлен (was delivered) ныне (today / now) курьером (by courier) главнокомандующему (to the commander in chief)."

- id: XVII
  ru: "Граф, распустив карты веером, с трудом удерживался от привычки послеобеденного сна и всему смеялся."
  en: "The count, spreading his cards like a fan, struggled against his habitual after-dinner sleepiness and laughed at everything."
  roman: "Graf, raspustiv karty veyerom, s trudom uderzhivalsya ot privychki posleobedennogo sna i vsemu smeyalsya."
  words: "Граф (the count), распустив (spreading out) карты (cards) веером (like a fan), с (with) трудом (difficulty) удерживался (restrained himself) от (from) привычки (the habit) послеобеденного (after-dinner) сна (sleep) и (and) всему (at everything) смеялся (laughed)."

- id: XVIII
  ru: "В то время как у Ростовых танцовали в зале шестой англез под звуки от усталости фальшививших музыкантов, и усталые официанты и повара готовили ужин, с графом Безуховым сделался шестой удар."
  en: "While at the Rostovs’ the sixth English country dance was being danced in the hall to the sound of musicians playing out of tune from fatigue, and weary servants and cooks prepared supper, Count Bezukhov suffered his sixth stroke."
  roman: "V to vremya kak u Rostovykh tantsovali v zale shestoy anglez pod zvuki ot ustalosti falshivivshikh muzykantov, i ustalye ofitsianty i povara gotovili uzhin, s grafom Bezukhovym sdelalsya shestoy udar."
  words: "В (at) то (the) время (time) как (while) у (at) Ростовых (the Rostovs') танцовали (they danced) в (in) зале (the hall) шестой (the sixth) англез (English country dance) под (to) звуки (the sounds) от (from) усталости (fatigue) фальшививших (playing out of tune) музыкантов (musicians), и (and) усталые (tired) официанты (servants / waiters) и (and) повара (cooks) готовили (prepared) ужин (supper), с (with) графом (Count) Безуховым (Bezukhov) сделался (occurred) шестой (the sixth) удар (stroke)."

- id: XIX
  ru: "В то время как такие разговоры происходили в приемной и в княжниной комнатах, карета с Пьером, за которым было послано, и с Анной Михайловной, которая нашла нужным ехать с ним, въезжала во двор графа Безухова."
  en: "While such conversations were taking place in the reception room and in the princess’s rooms, the carriage carrying Pierre, for whom someone had been sent, and Anna Mikhaylovna, who had considered it necessary to go with him, entered Count Bezukhov’s courtyard."
  roman: "V to vremya kak takie razgovory proiskhodili v priyemnoy i v knyazhninoy komnatakh, kareta s Pyerom, za kotorym bylo poslano, i s Annoy Mikhaylovnoy, kotoraya nashla nuzhnym yekhat s nim, vyezzhala vo dvor grafa Bezukhova."
  words: "В (at) то (the) время (time) как (while) такие (such) разговоры (conversations) происходили (were taking place) в (in) приемной (the reception room) и (and) в (in) княжниной (the princess's) комнатах (rooms), карета (the carriage) с (with) Пьером (Pierre), за (for) которым (whom) было (had been) послано (sent), и (and) с (with) Анной (Anna) Михайловной (Mikhaylovna), которая (who) нашла (found / considered) нужным (necessary) ехать (to go) с (with) ним (him), въезжала (entered / drove into) во (into) двор (the courtyard) графа (of Count) Безухова (Bezukhov)."

- id: XX
  ru: "Часть комнаты за колоннами, где с одной стороны стояла высокая красного дерева кровать, под шелковыми занавесами, а с другой огромный киот с образами, была красно и ярко освещена, как бывают освещены церкви во время вечерней службы."
  en: "The part of the room beyond the columns, where on one side stood a tall mahogany bed under silk curtains and on the other an enormous icon case, was brightly lit in red, as churches are lit during an evening service."
  roman: "Chast komnaty za kolonnami, gde s odnoy storony stoyala vysokaya krasnogo dereva krovat, pod shelkovymi zanavesami, a s drugoy ogromnyy kiot s obrazami, byla krasno i yarko osveshchena, kak byvayut osveshcheny tserkvi vo vremya vecherney sluzhby."
  words: "Часть (part) комнаты (of the room) за (beyond) колоннами (the columns), где (where) с (on) одной (one) стороны (side) стояла (stood) высокая (tall) красного (red) дерева (wood / mahogany) кровать (bed), под (under) шелковыми (silk) занавесами (curtains), а (and / while) с (on) другой (the other) огромный (enormous) киот (icon case) с (with) образами (icons), была (was) красно (redly) и (and) ярко (brightly) освещена (lit), как (as) бывают (are) освещены (lit) церкви (churches) во (during) время (the time of) вечерней (evening) службы (service)."

- id: XXI
  ru: "В приемной никого уже не было, кроме князя Василия и старшей княжны, которые, сидя под портретом Екатерины, о чем-то оживленно говорили."
  en: "There was no one left in the reception room except Prince Vasily and the eldest princess, who sat beneath Catherine’s portrait and spoke animatedly about something."
  roman: "V priyemnoy nikogo uzhe ne bylo, krome knyazya Vasiliya i starshey knyazhny, kotorye, sidya pod portretom Ekateriny, o chem-to ozhivlenno govorili."
  words: "В (in) приемной (the reception room) никого (no one) уже (any longer) не (not) было (was), кроме (except) князя (Prince) Василия (Vasily) и (and) старшей (eldest) княжны (princess), которые (who), сидя (sitting) под (beneath) портретом (the portrait of) Екатерины (Catherine), о (about) чем-то (something) оживленно (animatedly) говорили (spoke)."

- id: XXII
  ru: "В Лысых Горах, имении князя Николая Андреевича Болконского, ожидали с каждым днем приезда молодого князя Андрея с княгиней; но ожидание не нарушило стройного порядка, по которому шла жизнь в доме старого князя."
  en: "At Bald Hills, the estate of Prince Nikolai Andreyevich Bolkonsky, they expected each day the arrival of young Prince Andrei with his wife; but the expectation did not disturb the orderly routine by which life proceeded in the old prince’s house."
  roman: "V Lysykh Gorakh, imenii knyazya Nikolaya Andreyevicha Bolkonskogo, ozhidali s kazhdym dnem priezda molodogo knyazya Andreya s knyaginey; no ozhidanie ne narushilo stroynogo poryadka, po kotoromu shla zhizn v dome starogo knyazya."
  words: "В (at) Лысых (Bald) Горах (Hills), имении (the estate) князя (of Prince) Николая (Nikolai) Андреевича (Andreyevich) Болконского (Bolkonsky), ожидали (they expected) с (with) каждым (each) днем (day) приезда (the arrival) молодого (young) князя (Prince) Андрея (Andrei) с (with) княгиней (the princess / his wife); но (but) ожидание (the expectation) не (did not) нарушило (disturb) стройного (orderly) порядка (order), по (by) которому (which) шла (proceeded) жизнь (life) в (in) доме (the house) старого (old) князя (prince)."

- id: XXIII
  ru: "В это время подъехала к крыльцу карета и бричка, и из кареты вышел князь Андрей, высадил свою маленькую жену и пропустил ее вперед."
  en: "At that moment a carriage and a chaise drew up at the entrance, and Prince Andrei got out of the carriage, helped his little wife down, and let her go ahead."
  roman: "V eto vremya podyekhala k kryltsu kareta i brichka, i iz karety vyshel knyaz Andrey, vysadil svoyu malenkuyu zhenu i propustil yeye vpered."
  words: "В (at) это (that) время (moment) подъехала (drew up) к (to) крыльцу (the entrance) карета (a carriage) и (and) бричка (a chaise), и (and) из (out of) кареты (the carriage) вышел (got out) князь (Prince) Андрей (Andrei), высадил (helped down) свою (his) маленькую (little) жену (wife) и (and) пропустил (let / allowed) ее (her) вперед (ahead)."

- id: XXIV
  ru: "В назначенный час, напудренный и выбритый, князь вышел в столовую, где ожидала его невестка, княжна Марья, мадемуазель Бурьен и архитектор князя, по странной прихоти его допускаемый к столу."
  en: "At the appointed hour, powdered and shaved, the prince came out to the dining room, where his daughter-in-law, Princess Marya, Mademoiselle Bourienne, and the prince’s architect—admitted to the table by one of the prince’s strange whims—were waiting for him."
  roman: "V naznachennyy chas, napudrennyy i vybrityy, knyaz vyshel v stolovuyu, gde ozhidala ego nevestka, knyazhna Marya, mademuazel Buryen i arkhitektor knyazya, po strannoy prikhoti ego dopuskaemyy k stolu."
  words: "В (at) назначенный (appointed) час (hour), напудренный (powdered) и (and) выбритый (shaved), князь (the prince) вышел (came out) в (into) столовую (the dining room), где (where) ожидала (waited for) его (him) невестка (his daughter-in-law), княжна (Princess) Марья (Marya), мадемуазель (Mademoiselle) Бурьен (Bourienne) и (and) архитектор (the architect) князя (of the prince), по (by) странной (strange) прихоти (whim) его (his) допускаемый (admitted) к (to) столу (the table)."

- id: XXV
  ru: "В минуты отъезда и перемены жизни, на людей, способных обдумывать свои поступки, обыкновенно находит серьезное настроение мыслей."
  en: "At moments of departure and change in life, people capable of reflecting on their actions are usually seized by a serious frame of mind."
  roman: "V minuty otyezda i peremeny zhizni, na lyudey, sposobnykh obdumivat svoi postupki, obyknovenno nakhodit serieznoe nastroenie mysley."
  words: "В (at) минуты (moments) отъезда (of departure) и (and) перемены (change) жизни (in life), на (upon) людей (people), способных (capable) обдумывать (of considering / reflecting on) свои (their) поступки (actions), обыкновенно (usually) находит (comes over / seizes) серьезное (serious) настроение (mood / frame) мыслей (of thought)."
