- id: 1
  ru: Так говорила в июле 1805 года известная Анна Павловна Шерер, фрейлина и приближенная императрицы Марии Феодоровны, встречая важного и чиновного князя Василия, первого приехавшего на ее вечер
  roman: Tak govorila v iyule 1805 goda izvestnaya Anna Pavlovna Sherer, freylina i priblizhennaya imperatritsy Marii Feodorovny, vstrechaya vazhnogo i chinovnogo knyazya Vasiliya, pervogo priyekhavshego na yeye vecher
  en: That is what the well-known Anna Pavlovna Scherer—a lady-in-waiting and confidante of Empress Maria Feodorovna—said in July 1805 as she welcomed the high-ranking Prince Vasily, the first guest to arrive at her soirée.
  words: Так (thus / so) говорила (spoke / said) в (in) июле (July) 1805 (1805) года (year) известная (well-known) Анна (Anna) Павловна (Pavlovna) Шерер (Scherer), фрейлина (maid of honor) и (and) приближенная (close associate / confidante) императрицы (of the empress) Марии (Maria) Феодоровны (Feodorovna), встречая (receiving / greeting) важного (important / imposing) и (and) чиновного (high-ranking / official) князя (prince) Василия (Vasili), первого (the first) приехавшего (to arrive) на (to) ее (her) вечер (evening gathering / soirée)
- id: 2
  ru: Приехала высшая знать Петербурга, люди самые разнородные по возрастам и характерам, но одинаковые по обществу, в каком все жили; приехала дочь князя Василия, красавица Элен, заехавшая за отцом, чтобы с ним вместе ехать на праздник посланника
  roman: Priyekhala vysshaya znat' Peterburga, lyudi samyye raznorodnyye po vozrastam i kharakteram, no odinakovyye po obshchestvu, v kakom vse zhili; priyekhala doch' knyazya Vasiliya, krasavitsa Elen, zayekhavshaya za ottsom, chtoby s nim vmeste yekhat' na prazdnik poslannika
  en: The high nobility of St. Petersburg had arrived—people of widely varying ages and temperaments, yet sharing the same social milieu; Prince Vasily’s daughter, the beautiful Hélène, had also arrived, having stopped to pick up her father so they could go together to the ambassador’s reception
  words: Приехала (arrived) высшая (the highest) знать (nobility / society) Петербурга (of Petersburg), люди (people) самые (the most) разнородные (varied / diverse) по (in / with respect to) возрастам (ages) и (and) характерам (characters / temperaments), но (but) одинаковые (alike / the same) по (in) обществу (society), в (in) каком (which) все (all) жили (lived); приехала (arrived) дочь (daughter) князя (of Prince) Василия (Vasili), красавица (the beauty / beautiful woman) Элен (Hélène), заехавшая (who had stopped by / called in) за (for) отцом (her father), чтобы (in order to / so as to) с (with) ним (him) вместе (together) ехать (to go) на (to) праздник (celebration / fête) посланника (of the ambassador)
