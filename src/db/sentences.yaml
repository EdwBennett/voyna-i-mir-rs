- id: 1
  ru: Так говорила в июле 1805 года известная Анна Павловна Шерер, фрейлина и приближенная императрицы Марии Феодоровны, встречая важного и чиновного князя Василия, первого приехавшего на ее вечер
  ipa: Tak govorila v iyule 1805 goda izvestnaya Anna Pavlovna Sherer, freylina i priblizhennaya imperatritsy Marii Feodorovny, vstrechaya vazhnogo i chinovnogo knyazya Vasiliya, pervogo priyekhavshego na yeye vecher
  en: That is what the well-known Anna Pavlovna Scherer—a lady-in-waiting and confidante of Empress Maria Feodorovna—said in July 1805 as she welcomed the high-ranking Prince Vasily, the first guest to arrive at her soirée.
  words: Thus spoke in July 1805 the well-known Anna Pavlovna Scherer, maid of honor and close associate of Empress Maria Feodorovna, greeting the important and high-ranking Prince Vasily, the first to arrive at her evening gathering
- id: 2
  ru: Приехала высшая знать Петербурга, люди самые разнородные по возрастам и характерам, но одинаковые по обществу, в каком все жили; приехала дочь князя Василия, красавица Элен, заехавшая за отцом, чтобы с ним вместе ехать на праздник посланника
  ipa: Priyekhala vysshaya znat' Peterburga, lyudi samyye raznorodnyye po vozrastam i kharakteram, no odinakovyye po obshchestvu, v kakom vse zhili; priyekhala doch' knyazya Vasiliya, krasavitsa Elen, zayekhavshaya za ottsom, chtoby s nim vmeste yekhat' na prazdnik poslannika
  en: The high nobility of St. Petersburg had arrived—people of widely varying ages and temperaments, yet sharing the same social milieu; Prince Vasily’s daughter, the beautiful Hélène, had also arrived, having stopped to pick up her father so they could go together to the ambassador’s reception
  words: Arrived the highest nobility of Petersburg, people most diverse by ages and characters, but alike by the society in which all lived; arrived the daughter of Prince Vasily, the beauty Hélène, having called for her father, so as with him together to go to the ambassador’s celebration
